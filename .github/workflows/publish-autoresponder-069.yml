name: Publish AutoResponder Pro v0.6.9 verified APK
on:
  push:
    branches: [fix/autoresponder-069-smart-payments-conversation]
    paths:
      - .github/workflows/publish-autoresponder-069.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve already verified APK and check SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download 38327015656 --repo "$GITHUB_REPOSITORY" --name AutoResponder-Pro-v0.6.9-APK --dir release-files
          mv release-files/app-debug.apk release-files/AutoResponder-Pro-v0.6.9.apk
          echo "7e7fdfb01ad9bc4ade7fddc20dce78cf3068cc0f21f8d59f43cdfdbabf5fd5e8  release-files/AutoResponder-Pro-v0.6.9.apk" | sha256sum -c -
      - name: Publish direct browser APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=autoresponder-pro-v0.6.9
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/AutoResponder-Pro-v0.6.9.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-files/AutoResponder-Pro-v0.6.9.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "AutoResponder Pro v0.6.9 - Android APK" \
              --notes "v0.6.9: responde saludos por hora, sigue conversaciones de compra y ofrece medios de pago tras elegir un plan; solucionado 1/1️⃣/opcion uno para Nequi y opciones 2/3/4, con contexto separado por chat y WhatsApp. Conserva contactos vendedores, renovaciones, atencion humana y cuentas de pago compartidas. Pruebas Android y web y firma APK verificadas. No modifica produccion/main."
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "AutoResponder Pro v0.6.9 - Android APK"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url
