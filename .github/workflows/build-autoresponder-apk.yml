name: AutoResponder Pro 0.5.4 - APK sin firmar
on:
  push:
    branches: [autoresponder-pro-build-2026]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto 0.5.4
        run: unzip -q AutoResponder_Pro_v0.5.4_Codigo.zip -d source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar SDK Android
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verificar JavaScript y reglas
        run: |
          node --check source/autoresponder-pro/web/app.js
          node source/autoresponder-pro/tests/smoke.test.cjs
          node source/autoresponder-pro/tests/workflow.test.cjs
          node source/autoresponder-pro/tests/schedules.test.cjs
      - name: Probar Kotlin y compilar release SIN FIRMA
        run: cd source/autoresponder-pro/android && gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Preparar APK alineado y herramienta pública de firma
        run: |
          mkdir -p signing
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          "$ZIPALIGN" -f -p 4 source/autoresponder-pro/android/app/build/outputs/apk/release/app-release-unsigned.apk signing/AutoResponder_Pro_0.5.4_UNSIGNED.apk
          "$ZIPALIGN" -c -v 4 signing/AutoResponder_Pro_0.5.4_UNSIGNED.apk
          cp "$SIGNER" signing/apksigner.jar
          java -jar signing/apksigner.jar --version
      - name: Descargar resultados
        uses: actions/upload-artifact@v4
        with:
          name: AutoResponder-0.5.4-unsigned-and-signing-tool
          path: signing/
          retention-days: 7
          if-no-files-found: error
