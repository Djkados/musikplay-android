name: AutoResponder notification regression baseline
on:
  push:
    branches: [fix/autoresponder-055-capture-back]
    paths: [.github/workflows/test-autoresponder-055.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q AutoResponder_Pro_v0.5.4_Codigo.zip -d source
          cp patch055/NotificationCaptureRegressionTest.kt source/autoresponder-pro/android/app/src/test/java/com/autoresponder/pro/
          python - <<'PY'
          from pathlib import Path
          p=Path('source/autoresponder-pro/android/app/build.gradle.kts')
          s=p.read_text().replace('buildTypes {', 'testOptions { unitTests.isIncludeAndroidResources = true }\n    buildTypes {')
          s += '\ndependencies { testImplementation("org.robolectric:robolectric:4.14.1") }\n'
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run real listener regression tests
        run: cd source/autoresponder-pro/android && gradle --no-daemon testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoresponder-regression-baseline-reports
          path: source/autoresponder-pro/android/app/build/test-results/
          retention-days: 3
          if-no-files-found: warn
