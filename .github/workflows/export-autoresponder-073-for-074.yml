          python patch070/04_version.py
          python -c 'import pathlib,hashlib,base64,lzma,subprocess; root=pathlib.Path("patch071"); encoded="".join((root/("part%d.b64"%i)).read_text().strip() for i in range(1,5)); patch=lzma.decompress(base64.b64decode(encoded)); assert hashlib.sha256(patch).hexdigest()=="214a269f5d4fb697f3888f0dcaee380be9c3f055da30ee21aea811a965d16de0", "Patch checksum mismatch"; subprocess.run(["patch","-p2","-d","source/autoresponder-pro","--batch","--forward"],input=patch,check=True)'
          python patch072/01_netflix_info.py
          python patch072/02_sales_store.py
          python patch072/03_sales_dashboard.py
          python patch072/04_tests_version.py
          python patch073/01_netflix_clarity.py
