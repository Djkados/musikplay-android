name: AutoResponder Pro 0.5 APK
on:
  push:
    branches: [autoresponder-pro-build-2026]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AutoResponder_Pro_v0.5.zip -d source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Probar lógica JavaScript
        run: |
          node source/autoresponder-pro/tests/smoke.test.cjs
          node source/autoresponder-pro/tests/workflow.test.cjs
          node source/autoresponder-pro/tests/schedules.test.cjs
      - name: Probar motor Kotlin y compilar APK
        run: cd source/autoresponder-pro/android && gradle --no-daemon testDebugUnitTest assembleDebug
      - name: APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: AutoResponder-Pro-0.5-debug
          path: source/autoresponder-pro/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
