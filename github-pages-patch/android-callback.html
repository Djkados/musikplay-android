<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Volviendo a Musikplay…</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.box{text-align:center;padding:32px}.mark{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:#b7ff00;color:#050505;font-size:34px;font-weight:900;box-shadow:0 0 45px rgba(183,255,0,.2)}h1{margin:0 0 8px;font-size:24px}p{margin:0 0 22px;color:#9c9c9c}a{display:inline-block;background:#b7ff00;color:#050505;text-decoration:none;padding:14px 22px;border-radius:999px;font-weight:800}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark">♫</div>
    <h1>Volviendo a Musikplay</h1>
    <p>La autorización de Spotify está lista.</p>
    <a id="open" href="#">Abrir Musikplay</a>
  </main>
  <script>
    const target = 'musikplay://callback' + location.search + location.hash;
    document.getElementById('open').href = target;
    setTimeout(() => location.href = target, 120);
  </script>
</body>
</html>
