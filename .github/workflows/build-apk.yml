name: Build Musikplay APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Spotify App Remote SDK 0.8.0
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 \
            "https://github.com/spotify/android-sdk/releases/download/v0.8.0-appremote_v2.1.0-auth/spotify-app-remote-release-0.8.0.aar" \
            -o app/libs/spotify-app-remote-release-0.8.0.aar
          test -s app/libs/spotify-app-remote-release-0.8.0.aar

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing fingerprint
        run: |
          keytool -list -v \
            -keystore app/keystore/musikplay-dev.jks \
            -alias musikplaydev \
            -storepass musikplaydev | grep -E "SHA1:|SHA256:"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Musikplay-Android-V2.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
