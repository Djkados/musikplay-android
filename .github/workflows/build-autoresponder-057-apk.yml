name: AutoResponder Pro v0.5.7 direct APK build
on:
  push:
    branches: [fix/autoresponder-057-single-reply]
    paths:
      - .github/workflows/build-autoresponder-057-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed Android source
        run: |
          unzip -q AutoResponder_Pro_v0.5.4_Codigo.zip -d source
          python patch055/apply_capture_back_fix.py
          python patch056/apply_all_incoming_fix.py
          mkdir -p source/autoresponder-pro/android/app/src/test/java/com/autoresponder/pro
          cp patch055/NotificationCaptureRegressionTest.kt source/autoresponder-pro/android/app/src/test/java/com/autoresponder/pro/
          python patch057/apply_single_reply_fix.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble APK with own-message guard
        run: cd source/autoresponder-pro/android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AutoResponder-Pro-0.5.7-direct-APK
          path: source/autoresponder-pro/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
